<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Poste Linux sécurisé</title><desc id="d">Bureau sombre avec terminal, bouclier et modules isolés</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#102c45"/></linearGradient><linearGradient id="g"><stop stop-color="#70b7ff"/><stop offset="1" stop-color="#7ce5c5"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="15"/></filter></defs><rect width="1200" height="720" rx="38" fill="url(#bg)"/><circle cx="970" cy="120" r="210" fill="#3477a8" opacity=".16" filter="url(#glow)"/><rect x="100" y="92" width="1000" height="536" rx="25" fill="#090f17" stroke="#5b7790" stroke-opacity=".48" stroke-width="2"/><path d="M100 162h1000" stroke="#32485a"/><circle cx="142" cy="127" r="8" fill="#ff756d"/><circle cx="171" cy="127" r="8" fill="#e9c46a"/><circle cx="200" cy="127" r="8" fill="#76d5a0"/><g font-family="monospace" font-size="23" fill="#8ba6ba"><text x="145" y="225">$ system posture --status</text><text x="145" y="274" fill="#78d7be">✓ disk encrypted</text><text x="145" y="317" fill="#78d7be">✓ updates current</text><text x="145" y="360" fill="#78d7be">✓ firewall active</text><text x="145" y="421">$ identity --separate-profiles</text><text x="145" y="470" fill="#72b5f4">private  work  public</text></g><path d="M846 252l90-38 90 38v90c0 84-56 139-90 156-34-17-90-72-90-156z" fill="none" stroke="url(#g)" stroke-width="11"/><path d="M894 347l29 29 59-71" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="570" font-family="system-ui" font-size="18" letter-spacing="5" fill="#5e788c">CONTROL · UPDATE · ISOLATE</text></svg>
